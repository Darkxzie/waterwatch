image: node:20

stages:
  - format
  - lint
  - type_check
  - test
  - coverage
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - client/node_modules/
    - server/node_modules/

default:
  before_script:
    - npm ci

format:
  stage: format
  script:
    - npm run format:check

lint:
  stage: lint
  script:
    - npm run lint

type_check:
  stage: type_check
  script:
    - npx tsc --noEmit --project tsconfig.json

test:
  stage: test
  script:
    - npm run prisma:generate
    - npm test

coverage:
  stage: coverage
  script:
    - npm run prisma:generate
    - npm run test:coverage

pages:
  stage: deploy
  script:
    - npm run build --workspace client
    - cp -r client/dist public
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
    expire_in: never
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
