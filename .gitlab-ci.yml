image: node:20

cache:
  paths:
    - node_modules/
    - client/node_modules/
    - server/node_modules/

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build --workspace client
    - cp -r client/dist public
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
    expire_in: never
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
